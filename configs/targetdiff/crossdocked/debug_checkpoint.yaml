# Diagnostic config for checkpoint debugging under 4-GPU DDP.
# Same diagnostic prints as the 1-GPU baseline (see [CKPT-DBG] / [STEP-DBG] / [EPOCH-END-DBG]).
# Goal: observe whether global_step, _last_global_step_saved, skip, and
# callback_metrics['train/reward_mean'] behave differently under DDP compared
# to the 1-GPU run.
#
# Key things to watch in the log:
#   [STEP-DBG]      — reward_mean value returned by training_step (per rank 0)
#   [EPOCH-END-DBG] — callback_metrics['train/reward_mean'] at epoch end (rank 0)
#   [CKPT-DBG]      — what ModelCheckpoint sees: global_step, _last_global_step_saved,
#                     monitor value, kth_value, skip flag
#   [CKPT-DBG _save_last] — absent in epochs where skip fires or top-k doesn't save
#
# Usage (4-GPU interactive node):
#   srun --ntasks-per-node=4 --gpus-per-task=1 \
#     python scripts/train.py \
#       --config configs/targetdiff/crossdocked/debug_checkpoint.yaml \
#       --warm_start_from_ddpm checkpoints/targetdiff_pretrained_models/targetdiff_pretrained_diffusion.pt \
#       --datadir /data/stat-cadd/wolf7055/PRISM/data/cross_dock/processed_crossdock_targetdiff \
#       --logdir /tmp/prism_debug_4gpu \
#       --seed 42

run_identifier: 'debug_checkpoint_4gpu'
logdir: '/tmp/prism_debug_4gpu'

wandb_params:
  mode: 'disabled'
  entity: 'sanazkazeminia97'
  project: 'PRISM-debug'

model_type: targetdiff

freeze_except:
  - 'v_inference'
  - 'refine_net.base_block.7'
  - 'refine_net.base_block.8'

model:
  checkpoint: 'checkpoints/targetdiff_pretrained_models/targetdiff_pretrained_diffusion.pt'
  protein_feat_dim: 27
  ligand_atom_types: 13
  total_timesteps: 1000

# -----------------------------------------------------------------------
# Data — 4 GPUs, small batch; each GPU gets its own disjoint pocket shard
# -----------------------------------------------------------------------
datadir: '/data/stat-cadd/wolf7055/PRISM/data/cross_dock/processed_crossdock_targetdiff'
dataset: 'crossdock'
batch_size: 4       # 1 pocket per GPU per step (4 GPUs × 1 = 4 total per step)
num_workers: 0
gpus: 4             # 4-GPU DDP diagnostic
n_epochs: 1

enable_progress_bar: True
num_sanity_val_steps: 0

# -----------------------------------------------------------------------
# PPO — 1 molecule per GPU per rollout; keeps each epoch fast under DDP
# -----------------------------------------------------------------------
ppo:
  num_outer_epochs: 10      # 10 epochs to observe skip / global_step / kth_value behaviour
  num_inner_epochs: 1
  n_steps: 1                # 1 molecule per GPU per rollout (4 total across 4 GPUs)
  ligand_chunk_size: 1
  batch_size: 1             # 1 molecule per minibatch per GPU
  clip_range: 0.1
  entropy_coef: 0.001
  kl_coef: 0.0
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  train_timesteps: 10       # only 10 diffusion steps so rollout is fast
  target_kl: null
  lr: 3.0e-5
  num_nodes_lig: 27

# -----------------------------------------------------------------------
# Rewards — penalised logP only (no external files needed)
# -----------------------------------------------------------------------
docking_params:
  dataset_info: custom

reward_params:
  target_name: 'BRD4_BD1'
  aggregation: 'weighted_sum'
  rewards:
    qed: 0.0
    sa_score: 0.0
    lipinski: 0.0
    bertz: 0.0
    sucos: 0.0
    interaction_fingerprints: 0.0
    feature_density: 0.0
    geometry_checks: 0.0
    flatness_checks: 0.0
    aromatic_counter: 0.0
    aromatic_anchor: 0.0
    multi_features: 0.0
    silly_walks: 0.0
    property_2d: 0.0
    smina_docking: 0.0
    custom_qed: 0.0
    custom_sa_score: 0.0
    penalised_logp: 1.0
  reward_paths:
    feature_density: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    aromatic_anchor: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    multi_features: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    silly_walks: 'src/prism/reward/scoring/reward_data/chembl_drugs.smi'
    property_2d: 'src/prism/reward/scoring/reward_data/propeties_ref.json'

# -----------------------------------------------------------------------
# Evaluation — disabled for speed
# -----------------------------------------------------------------------
eval_epochs: 99999
visualize_sample_epoch: 99999
visualize_chain_epoch: 999999
eval_params:
  n_eval_samples: 4
  eval_batch_size: 4
  smiles_file: '/data/stat-cadd/wolf7055/PRISM/data/cross_dock/processed_crossdock_targetdiff/train_smiles.npy'
  n_visualize_samples: 0
  keep_frames: 0
