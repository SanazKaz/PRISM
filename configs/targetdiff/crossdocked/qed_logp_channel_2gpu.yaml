# TargetDiff PPO fine-tuning config
# Run with:
#   python scripts/train.py --config configs/targetdiff/crossdocked/qed_logp_channel_2gpu.yaml \
#       --datadir /path/to/crossdocked_data --seed 42
#
# Same as qed.yaml but run on 2 GPUs with channel-balanced gradients and
# single-pocket overfitting diagnostic.

run_identifier: 'same_but_with_logp_channel_scale_qed_opt'
logdir: 'Log_Results'

wandb_params:
  mode: 'offline'
  entity: 'sanazkazeminia97'
  project: 'Real_TargetDiff_geometry'

model_type: targetdiff

# TargetDiff UniTransformer layer names (9 layers total, indices 0-8).
# We freeze the bulk of the network and fine-tune:
#   - v_inference head                    (atom type output)
#   - last transformer layers (7, 8)
freeze_except:
  - 'v_inference'
  - 'refine_net.base_block.8'

model:
  checkpoint: 'checkpoints/targetdiff_pretrained_diffusion.pt'
  protein_feat_dim: 27
  ligand_atom_types: 13
  total_timesteps: 1000

# -----------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------
datadir: '/data/stat-cadd/wolf7055/PRISM/data/cross_dock/processed_crossdock_targetdiff'
dataset: 'crossdock'
batch_size: 1          # REQUIRED: blank/None disables DataLoader auto-batching,
                       # causing collate_fn to receive a raw dict -> KeyError: 0.
num_workers: 4
gpus: 2
n_epochs: 1

enable_progress_bar: False
num_sanity_val_steps: 0

train_single_pocket: true

# -----------------------------------------------------------------------
# PPO algorithm knobs
# -----------------------------------------------------------------------
ppo:
  use_grpo_advantages: False
  num_outer_epochs: 60
  num_inner_epochs: 2
  n_steps: 100
  ligand_chunk_size: 64
  batch_size: 100
  clip_range: 0.1
  entropy_coef: 0.0
  kl_coef: 0.0
  max_grad_norm: 1.0
  gradient_accumulation_steps: 168
  train_timesteps: 300
  target_kl: 3.0
  ref_kl_coef: 0.00
  lr: 2.0e-4
  num_nodes_lig: 27

  # Reweight per-channel gradient contribution. Coordinates keep weight=1.0;
  # the atom-type channel is amplified so QED/SA rewards get real signal.
  channel_grad_scale:
    pos: 1.0
    v:   200000.0

# Gradient / weight-update diagnostics
grad_logging:
  enabled: true
  every_n_epochs: 5
  log_histogram: true
  per_block_histogram: true
  max_hist_elements: 1000000

# -----------------------------------------------------------------------
# Rewards
# -----------------------------------------------------------------------
docking_params:
  dataset_info: custom

reward_params:
  target_name: 'BRD4_BD1'
  aggregation: 'product'
  rewards:
    qed: 0.0
    sa_score: 0.0
    lipinski: 0.0
    bertz: 0.0
    sucos: 0.0
    interaction_fingerprints: 0.0
    feature_density: 0.0
    geometry_checks: 0.0
    flatness_checks: 0.0
    aromatic_counter: 0.0
    aromatic_anchor: 0.0
    multi_features: 0.0
    silly_walks: 0.0
    property_2d: 0.0
    smina_docking: 0.0
    custom_qed: 1.0
    custom_sa_score: 0.0
    penalised_logp: 0.0
  reward_paths:
    feature_density: '/data/stat-cadd/wolf7055/PRISM/data/BRD4_BD1/hotspot_analysis/BRD4_BD1_hotspot_data.pkl'
    aromatic_anchor: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    multi_features: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    silly_walks: 'src/prism/reward/scoring/reward_data/chembl_drugs.smi'
    property_2d: 'src/prism/reward/scoring/reward_data/propeties_ref.json'

# -----------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------
eval_epochs: 5
visualize_sample_epoch: 99999
visualize_chain_epoch: 999999
eval_params:
  n_eval_samples: 20
  eval_batch_size: 20
  smiles_file: '/data/stat-cadd/wolf7055/PRISM/data/cross_dock/processed_crossdock_noH_full_temp/train_smiles.npy'
  n_visualize_samples: 0
  keep_frames: 0
