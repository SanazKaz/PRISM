# TargetDiff PPO fine-tuning config
# Run with:
#   python scripts/train.py --config configs/targetdiff_ppo.yaml \
#       --datadir /path/to/crossdocked_data --seed 42

# run_identifier: '3e-4_log_probs_debugged_geometry_1e-3_clip_01_banded_500_850'
run_identifier: 'main_updat'
logdir: 'Log_Results'

wandb_params:
  mode: 'offline'
  project: 'Real_TargetDiff_geometry'

model_type: targetdiff

# TargetDiff UniTransformer layer names (9 layers total, indices 0-8).
# We freeze the bulk of the network and fine-tune:
#   - v_inference head                    (atom type output)
#   - last transformer layers (7, 8)
freeze_except:
  - 'v_inference'
  - 'refine_net.base_block.0'
  - 'refine_net.base_block.2'
  - 'refine_net.base_block.8'

model:
  checkpoint: 'checkpoints/targetdiff_pretrained_diffusion.pt'
  protein_feat_dim: 27
  ligand_atom_types: 13
  total_timesteps: 1000

# -----------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------
datadir: '/data/stat-cadd/wolf7055/PRISM/data/cross_dock/processed_crossdock_targetdiff'
dataset: 'crossdock'
batch_size: 32
num_workers: 4
gpus: 1
n_epochs: 1

enable_progress_bar: False
num_sanity_val_steps: 0

train_single_pocket: False


# -----------------------------------------------------------------------
# PPO algorithm knobs
# -----------------------------------------------------------------------
ppo:
  use_grpo_advantages: False # new
  num_outer_epochs: 60
  num_inner_epochs: 2
  n_steps: 64
  ligand_chunk_size: 64
  batch_size: 64
  clip_range: 0.1
  entropy_coef: 0.0
  kl_coef: 0.0
  max_grad_norm: 1.0
  gradient_accumulation_steps: 300
  train_timesteps: 500            # PPO trains on the last 500 of 1000 reverse steps
  # Which part of the reverse chain to train on (t: 0=clean, 999=noisiest):
  #   timestep_window: last   -> final train_timesteps low-noise steps (default)
  #   timestep_window: first  -> initial train_timesteps high-noise steps
  #   timestep_window: band   -> only steps with t in [t_lo, t_hi] (ignores
  #                              train_timesteps); a middle band trades leverage
  #                              for lower seed variance (both scale with sigma(t)).
  timestep_window: band
  t_lo: 500
  t_hi: 850
  # timestep_window: last
  target_kl: 0.03
  ref_kl_coef: 0.05
  lr: 3.0e-4
  num_nodes_lig: 27

# Gradient / weight-update diagnostics
grad_logging:
  enabled: true
  every_n_epochs: 5
  log_histogram: true
  per_block_histogram: true
  max_hist_elements: 1000000

# -----------------------------------------------------------------------
# Rewards
# -----------------------------------------------------------------------
docking_params:
  dataset_info: custom

reward_params:
  target_name: 'BRD4_BD1'
  aggregation: 'product'
  rewards:
    qed: 0.0
    sa_score: 0.0
    lipinski: 0.0
    bertz: 0.0
    sucos: 0.0
    interaction_fingerprints: 0.0
    feature_density: 0.0
    geometry_checks: 1.0
    flatness_checks: 0.0
    aromatic_counter: 0.0
    aromatic_anchor: 0.0
    multi_features: 0.0
    silly_walks: 0.0
    property_2d: 0.0
    smina_docking: 0.0
    custom_qed: 0.0
    custom_sa_score: 0.0
    penalised_logp: 0.0
  reward_paths:
    feature_density: '/data/stat-cadd/wolf7055/PRISM/data/BRD4_BD1/hotspot_analysis/BRD4_BD1_hotspot_data.pkl'
    aromatic_anchor: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    multi_features: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    silly_walks: 'src/prism/reward/scoring/reward_data/chembl_drugs.smi'
    property_2d: 'src/prism/reward/scoring/reward_data/propeties_ref.json'

# -----------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------
eval_epochs: 5
visualize_sample_epoch: 99999
visualize_chain_epoch: 999999
eval_params:
  n_eval_samples: 20
  eval_batch_size: 20
  smiles_file: '/data/stat-cadd/wolf7055/PRISM/data/cross_dock/processed_crossdock_noH_full_temp/train_smiles.npy'
  n_visualize_samples: 0
  keep_frames: 0
