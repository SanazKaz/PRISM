run_identifier: 'bindingmoad_fa_ppo'
logdir: 'Log_Results'
wandb_params:
  mode: 'online'
  entity: 'sanazkazeminia97'
  project: 'BindingMOAD_FA_PPO'
dataset: 'bindingmoad'
datadir: '/Users/sanazkazeminia/Documents/PRISM/data/factor_Xa/03_final_dataset'  # UPDATE THIS
enable_progress_bar: False
num_sanity_val_steps: 0
batch_size: 108
lr: 1.0e-6
num_workers: 4
gpus: 1
n_epochs: 1

mode: 'pocket_conditioning'
pocket_representation: 'full-atom'

augment_noise: 0
augment_rotation: False
clip_grad: True
auxiliary_loss: False
loss_params:
  max_weight: 0.001
  schedule: 'linear'
  clamp_lj: 3.0

ppo_params:
  num_outer_epochs: 160
  num_inner_epochs: 2
  n_steps: 216
  ligand_chunk_size: 108
  ppo_batch_size: 108
  clip_range: 0.1
  value_loss_coef: 0.0
  entropy_coef: 0.001
  max_grad_norm: 1.0
  gradient_accumulation_steps: 42
  num_train_timesteps: 300
  num_mini_batches: 1
  target_kl: 0.03
  lr: 1.0e-5
  mol_timeout_sec: 60
  num_nodes_lig: 25
  top_k: False
  progressive_training: True
  start_timesteps: 50
  end_timesteps: 350
  progressive_training_epochs: 100

reward_params:
  rewards:
    qed: 0.0
    sa_score: 0.0
    lipinski: 0.0
    bertz: 0.0
    sucos: 0.0
    interaction_fingerprints: 0.0
    feature_density: 0.0
    geometry_checks: 0.0
    flatness_checks: 0.0
    aromatic_counter: 1.0
    aromatic_anchor: 0.0
    multi_features: 0.0
    silly_walks: 0.5
    silly_rings: 1.0
  reward_paths:
    feature_density: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    aromatic_anchor: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    multi_features: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    silly_walks: 'src/prism/reward/scoring/reward_data/chembl_drugs.smi'
    silly_rings: 'src/prism/reward/scoring/reward_data/chembl_ring_systems.csv'

# BindingMOAD full-atom architecture (must match checkpoint)
egnn_params:
  device: 'cuda'
  edge_cutoff_ligand: null
  edge_cutoff_pocket: 4.0
  edge_cutoff_interaction: 7.0
  reflection_equivariant: False
  edge_embedding_dim: 8
  joint_nf: 128
  hidden_nf: 192
  n_layers: 6
  attention: True
  tanh: True
  norm_constant: 1
  inv_sublayers: 1
  sin_embedding: False
  aggregation_method: 'sum'
  normalization_factor: 100

diffusion_params:
  diffusion_steps: 500
  diffusion_noise_schedule: 'polynomial_2'
  diffusion_noise_precision: 1.0e-5
  diffusion_loss_type: 'l2'
  normalize_factors: [1, 4]

eval_epochs: 5
visualize_sample_epoch: 99999
visualize_chain_epoch: 999999
eval_params:
  n_eval_samples: 20
  eval_batch_size: 20
  smiles_file: null  # UPDATE THIS if you have train_smiles.npy
  n_visualize_samples: 0
  keep_frames: 0
