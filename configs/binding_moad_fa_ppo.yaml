run_identifier: 'BM_final_geometry_checks_lr4e-7'
logdir: 'Log_Results'
wandb_params:
  mode: 'online'
  project: 'final_geometry_checks_BM'
dataset: 'bindingmoad'
datadir: '/data/stat-cadd/wolf7055/PRISM/data/BRD4_BD1/03_final_dataset'
enable_progress_bar: False
num_sanity_val_steps: 0
batch_size: 108
num_workers: 4
gpus: 1
n_epochs: 1

# BindingMOAD uses 6-layer EGNN (e_block_0..5); unfreeze the last two.
freeze_except: ['e_block_4', 'e_block_5']

model:
  total_timesteps: 500

  # BindingMOAD checkpoint architecture — differs from CrossDocked defaults.
  # These override the standard CrossDocked values in _build_diffsbdd_policy.
  egnn_params:
    device: 'cuda'
    edge_cutoff_ligand: null
    edge_cutoff_pocket: 4.0
    edge_cutoff_interaction: 7.0
    reflection_equivariant: False
    edge_embedding_dim: 8
    joint_nf: 128
    hidden_nf: 192
    n_layers: 6
    attention: True
    tanh: True
    norm_constant: 1
    inv_sublayers: 1
    sin_embedding: False
    aggregation_method: 'sum'
    normalization_factor: 100

  diffusion_params:
    # All other diffusion settings are the standard defaults.
    diffusion_noise_precision: 1.0e-5

ppo:
  num_outer_epochs: 45
  num_inner_epochs: 2
  n_steps: 216
  ligand_chunk_size: 108
  batch_size: 108
  clip_range: 0.1
  entropy_coef: 0.001
  kl_coef: 0.0
  max_grad_norm: 1.0
  gradient_accumulation_steps: 42
  train_timesteps: 300
  target_kl: 0.03
  lr: 4.0e-7
  num_nodes_lig: 28

reward_params:
  rewards:
    qed: 0.0
    sa_score: 0.0
    lipinski: 0.0
    bertz: 0.0
    sucos: 0.0
    interaction_fingerprints: 0.0
    feature_density: 0.0
    geometry_checks: 1.0
    flatness_checks: 0.0
    aromatic_counter: 0.0
    aromatic_anchor: 0.0
    multi_features: 0.0
    silly_walks: 0.0
    silly_rings: 0.0
  reward_paths:
    feature_density: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    aromatic_anchor: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    multi_features: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    silly_walks: 'src/prism/reward/scoring/reward_data/chembl_drugs.smi'
    silly_rings: 'src/prism/reward/scoring/reward_data/chembl_ring_systems.csv'

eval_epochs: 5
visualize_sample_epoch: 99999
visualize_chain_epoch: 999999
eval_params:
  n_eval_samples: 20
  eval_batch_size: 20
  smiles_file: /data/stat-cadd/wolf7055/PRISM/data/BRD4_BD1/03_final_dataset/train_smiles.npy
  n_visualize_samples: 0
  keep_frames: 0

# Gradient / layer-diagnostics logging (off by default; toggle per-run).
grad_logging:
  enabled: false
  every_n_epochs: 1
  log_histogram: true
  per_block_histogram: true
  max_hist_elements: 1000000
