# DiffSBDD PPO fine-tuning — default config.
#
# Rewards: QED + synthetic accessibility only. Everything else (PPO knobs,
# frozen layers) is identical to the validated multi-objective run, so this is
# a known-good starting point to add rewards to.
#
#   python scripts/train.py \
#       --config configs/diffsbdd/diffsbdd_default.yaml \
#       --warm_start_from_ddpm checkpoints/crossdocked_fullatom_cond.ckpt

run_identifier: 'diffsbdd_default'
logdir: 'Log_Results'

wandb_params:
  mode: 'offline'
  project: 'PRISM'

model_type: diffsbdd

# DiffSBDD's EGNN has 5 blocks named 'e_block_N' (0-indexed). Everything not
# listed here stays frozen, which anchors the policy to the pretrained prior.
freeze_except: ['e_block_3', 'e_block_4']

model:
  total_timesteps: 500   # full DiffSBDD diffusion chain length

# -----------------------------------------------------------------------
# Data — override with --datadir
# -----------------------------------------------------------------------
datadir: 'data/cross_dock/processed_crossdock_noH_full_temp'
dataset: 'crossdock'
batch_size: 64
num_workers: 4
gpus: 1
n_epochs: 1

enable_progress_bar: False
num_sanity_val_steps: 0

# -----------------------------------------------------------------------
# PPO algorithm knobs
# -----------------------------------------------------------------------
ppo:
  num_outer_epochs: 60
  num_inner_epochs: 2
  n_steps: 128
  ligand_chunk_size: 64
  batch_size: 128
  clip_range: 0.1
  entropy_coef: 0.001
  max_grad_norm: 1.0
  gradient_accumulation_steps: 42
  train_timesteps: 300
  target_kl: 0.03
  lr: 3.0e-5
  num_nodes_lig: 27

# Gradient / weight-update diagnostics — off by default, toggle per run.
grad_logging:
  enabled: false
  every_n_epochs: 1
  log_histogram: true
  per_block_histogram: true
  max_hist_elements: 1000000

# -----------------------------------------------------------------------
# Rewards — only weights > 0 are instantiated.
# weighted_sum accumulates without normalising, so keep the weights summing to 1.
# -----------------------------------------------------------------------
reward_params:
  aggregation: 'weighted_sum'
  rewards:
    custom_qed: 0.5
    custom_sa_score: 0.5

# -----------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------
eval_epochs: 10
visualize_sample_epoch: 99999
visualize_chain_epoch: 999999
eval_params:
  n_eval_samples: 20
  eval_batch_size: 20
  # Repointed automatically to <datadir>/train_smiles.npy by train.py.
  smiles_file: 'data/cross_dock/processed_crossdock_noH_full_temp/train_smiles.npy'
  n_visualize_samples: 0
  keep_frames: 0
