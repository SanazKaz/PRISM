run_identifier: 'lr_4e-5_more_timesteps_2_silly'
logdir: 'Log_Results'
wandb_params:
  mode: 'online' # seeing if it will reduce overhead 
  entity: 'sanazkazeminia97'
  project: 'qed_sascore_prism_beta_lactamase'
dataset: 'crossdock' #(refers to the model's dataset_info_key)
datadir: '/data/stat-cadd/wolf7055/PRISM/data/BRD4_BD1/03_final_dataset'
enable_progress_bar: False
num_sanity_val_steps: 0
batch_size: 1 # number of pockets to sample for (60)
lr: 1.0e-6 
num_workers: 0 # suggested by terminal for better parallelisations ???
gpus: 1
n_epochs: 1 # lightnings epoch which defines outer epochs using train_dataset size. Leave as 1

mode: 'pocket_conditioning'
pocket_representation: 'full-atom'

augment_noise: 0
augment_rotation: False
clip_grad: True
auxiliary_loss: False
loss_params:
  max_weight: 0.001
  schedule: 'linear'
  clamp_lj: 3.0

ppo_params:
  num_outer_epochs: 60         # num of PPO cycles (outer epochs)
  num_inner_epochs: 2            # Updates per rollout (inner epochs)
  n_steps: 10                    # Rollout length (mols generated)
  ligand_chunk_size: 10
  ppo_batch_size: 10             # Size of each PPO update batch
  clip_range: 0.1                # PPO clipping parameter
  value_loss_coef: 0.0           # Weight for value loss
  entropy_coef: 0.001            # Weight for entropy bonus
  max_grad_norm: 1.0             # Gradient clipping threshold
  gradient_accumulation_steps: 42   # accumulate over train_timesteps
  num_train_timesteps: 150
  num_mini_batches: 1            # Mini-batches per update
  target_kl: 0.03                # Early stopping KL divergence
  lr: 4.0e-5                     # Optimizer learning rate (0.001)
  mol_timeout_sec: 60
  num_nodes_lig: 25              # fixed number of nodes for ligand
  top_k: False
  # backward progressive training
  progressive_training: True
  start_timesteps: 50
  end_timesteps: 350
  progressive_training_epochs: 100
  freeze_except: ['e_block_3','e_block_4'] # e_block_3 and e_block_4 are the last two layers of the EGNN


reward_params:
  # Map the reward name to its weight
  # To disable a reward, simply remove it from this list or set weight to 0
  rewards:
    qed: 0.0
    sa_score: 0.0
    lipinski: 0.0
    bertz: 0.0
    sucos: 0.0
    interaction_fingerprints: 0.0
    feature_density: 0.0
    geometry_checks: 0.0
    flatness_checks: 1.0
    aromatic_counter: 0.0
    aromatic_anchor: 0.0
    multi_features: 0.0
    silly_walks: 0.0
    silly_rings: 0.0
    mmff_strain: 0.0
  reward_paths:
    feature_density: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    aromatic_anchor: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    multi_features: 'src/prism/reward/scoring/reward_data/ampc_hotspot_global_centered_eps0.5_min10_aromatic5.pkl'
    silly_walks: 'src/prism/reward/scoring/reward_data/chembl_drugs.smi'
    silly_rings: 'src/prism/reward/scoring/reward_data/chembl_ring_systems.csv'
    
#  (from diffsbdd original config)
egnn_params:
  device: 'cuda'
  edge_cutoff_ligand: null
  edge_cutoff_pocket: 5.0
  edge_cutoff_interaction: 5.0
  reflection_equivariant: False
  joint_nf: 32
  hidden_nf: 128 # change back to 256
  n_layers: 5
  attention: True
  tanh: True
  norm_constant: 1
  inv_sublayers: 1
  sin_embedding: False
  aggregation_method: 'sum'
  normalization_factor: 100

diffusion_params:
  diffusion_steps: 500
  diffusion_noise_schedule: 'polynomial_2'
  diffusion_noise_precision: 5.0e-4
  diffusion_loss_type: 'l2'
  normalize_factors: [1, 4]

eval_epochs: 20
visualize_sample_epoch: 99999
visualize_chain_epoch: 999999
eval_params:
  n_eval_samples: 20
  eval_batch_size: 20
  smiles_file: '/data/stat-cadd/wolf7055/PRISM/data/BRD4_BD1/03_final_dataset/train_smiles.npy'
  n_visualize_samples: 10
  keep_frames: 5
