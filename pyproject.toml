[project]
name = "prism"
version = "0.1.0"
description = "PRISM: Policy-Reinforced Iterative Structure-Based Molecular Diffusion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core scientific computing
    "numpy==2.4.1",
    "scipy==1.17.0",
    "pandas==3.0.0",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "scikit-learn==1.8.0",
    "networkx==3.6.1",
    
    # ML frameworks
    "torch==2.6.0",
    "lightning==2.5.0",
    "pytorch-lightning==2.6.0",
    "torchmetrics==1.8.2",
    "lightning-utilities==0.15.2",
    
    # Cheminformatics
    "rdkit==2025.9.3",
    "biopython==1.86",
    
    # Molecular tools
    "posebusters==0.6.3",
    "prolif==2.1.0",
    "datamol==0.12.5",
    "selfies==2.2.0",
    "medchem==2.0.5",
    
    # TargetDiff dependencies
    "easydict==1.13",
    "lmdb==2.2.0",

    # Utilities
    "pyyaml==6.0.3",
    "tqdm==4.67.1",
    "joblib==1.5.3",
    "imageio==2.37.2",
    "loguru==0.7.3",
    
    # Logging & tracking
    "wandb==0.25.1",
]

# torch-scatter, torch-cluster and torch-geometric are not installed from here:
# their wheels are built per (torch, CUDA) pair. Use environment.yml, which pins
# the CUDA 12.4 build and carries the right wheel index.

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"