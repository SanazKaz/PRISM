[project]
name = "prism"
version = "0.1.0"
description = "PRISM: Policy-Reinforced Iterative Structure-Based Molecular Diffusion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core Scientific Stack
    "numpy",
    "scipy",
    "pandas",
    "seaborn",
    "matplotlib",
    "scikit-learn",
    "networkx",
    "joblib",
    "tqdm",
    "pyyaml",
    "imageio",

    # Cheminformatics
    "rdkit",
    "biopython",
    "openbabel",
    
    # Molecular validation
    "posebusters",
    "prolif",
    
    # Logging
    "wandb",
]